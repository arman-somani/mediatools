# Render service definition.
#
# Only the three variables under "Required" must be set for the service to boot
# and be reachable. Everything below that is optional and degrades cleanly:
# the API reports what is and is not configured at /api/health/ready, so a
# half-configured deploy is diagnosable instead of mysteriously broken.

services:
  - type: web
    name: mediatools-backend
    env: docker
    rootDir: backend
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile

    # Points at the cheap liveness endpoint, not /api/health/ready. Render
    # restarts a service whose health check fails, and a transient Mongo blip
    # or a dead token sidecar is not a reason to reboot and kill in-flight
    # downloads. Use /api/health/ready manually to see component status.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

      # ---- Required -------------------------------------------------------
      # sync:false means Render prompts for the value and never stores it in
      # git. The process exits at boot if MONGODB_URI or JWT_SECRET is absent,
      # deliberately: serving traffic signed with a default key is worse than
      # not serving traffic.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated list of allowed browser origins, e.g.
      #   https://mediatools.vercel.app,http://localhost:3000
      # Not technically required, but it defaults to http://localhost:3000, so
      # leaving it unset means CORS rejects your real frontend and every
      # request fails in the browser while curl works fine.
      - key: FRONTEND_URL
        sync: false

      # ---- YouTube extraction ---------------------------------------------
      # PO tokens are generated locally, inside this container. No account, no
      # cookies, no third-party service — the generator solves the challenge
      # itself. This is the single most effective thing available in code alone.
      #
      # It runs in "script mode": yt-dlp spawns the generator only when a token
      # is needed and it exits straight after, caching the result on disk. That
      # matters on a 512MB instance. The alternative HTTP-server mode keeps a
      # second Node process resident for the container's whole life (~130MB)
      # and would be holding that memory *while* ffmpeg merges a video, which
      # is how you get OOM-killed mid-download.
      #
      # Set false to drop PO token support entirely; extraction then uses only
      # the clients that need no token, which works but exposes fewer formats.
      - key: ENABLE_POT_PROVIDER
        value: "true"

      # Reinstall yt-dlp from master at every boot. Adds 10-20s to a cold
      # start, but a stale yt-dlp is the single most common cause of a
      # deployment that worked last month and fails today: YouTube ships
      # breaking extractor changes without notice and fixes land on master
      # within days. On the free plan the container is spun down regularly
      # anyway, so this keeps the extractor fresh without manual redeploys.
      - key: YTDLP_AUTO_UPDATE
        value: "true"

      # Order of extraction clients to try. Leave unset to use the built-in
      # ladder (android_vr, tv_simply, web_safari, tv_embedded, default), which
      # gains the web clients automatically when token generation is available.
      - key: YT_CLIENT_LADDER
        sync: false

      # ---- Cloudflare egress pool (recommended) ---------------------------
      # Routes every download through Cloudflare Workers instead of Render's
      # datacenter IPs, with automatic failover: a bot check, rate limit or
      # mid-download block on one egress IP rotates to the next Worker, and
      # yt-dlp's .part files resume the transfer from where it stopped.
      #
      # Deploy cloudflare/yt-proxy (see CLOUDFLARE_PROXY_SETUP.md), then list
      # one or more Worker URLs here, comma-separated, plus the same secret
      # you set as the Worker's PROXY_TOKEN.
      - key: CF_PROXY_URLS
        sync: false
      - key: CF_PROXY_TOKEN
        sync: false

      # Additional fallback proxies (comma-separated http:// or socks5://
      # URLs), used after the Cloudflare pool and before direct egress.
      - key: YT_PROXY_URLS
        sync: false

      # Parallel fragment downloads per transfer. Higher is faster, lower is
      # less conspicuous. 3 is a good middle ground.
      - key: YT_CONCURRENT_FRAGMENTS
        value: "3"

      # How many egress routes one job may walk through before giving up.
      - key: YT_MAX_EGRESS_ATTEMPTS
        value: "8"

      # ---- Memory budget (512MB instance) ---------------------------------
      # Peak usage is the API plus yt-dlp plus one of (token generator | ffmpeg),
      # which do not overlap. Roughly: 190 + 70 + 120 = 380MB.
      #
      # Raising NODE_HEAP_MB without reducing something else is the fastest way
      # to get the container killed. Conversions already run strictly one at a
      # time; that is a deliberate constraint, not a limitation to remove.
      - key: NODE_HEAP_MB
        value: "192"
      # Jobs allowed to wait behind the running one. Beyond this, new requests
      # get a 503 with Retry-After rather than joining a backlog that cannot be
      # cleared before the finished files expire.
      - key: MAX_QUEUE_DEPTH
        value: "12"

      # ---- Optional: better YouTube success rate ---------------------------
      # With CF_PROXY_URLS configured above, the pool already handles IP
      # rotation through Cloudflare, and PROXY_URL is just one more fallback
      # route in the pool. Without it, a residential proxy in PROXY_URL is
      # the only remaining lever — the pool routes through it when set.
      - key: PROXY_URL
        sync: false
      # Base64 of a Netscape cookies.txt. Not required; unlocks age-restricted
      # videos and the `tv` client.
      #   Linux/macOS: base64 -w0 cookies.txt
      #   Windows:     certutil -encodehex -f cookies.txt out.b64 0x40000001
      # Use a throwaway account: these cookies grant access to it.
      - key: YOUTUBE_COOKIES_B64
        sync: false

      # ---- Optional: limits ------------------------------------------------
      - key: MAX_DURATION_SECONDS
        value: "5400"
      - key: MAX_FILE_SIZE_MB
        value: "250"
      # Hours a finished file stays on disk. Render's disk is ephemeral and
      # small, and the Conversion TTL index expires the database record on the
      # same clock.
      - key: FILE_TTL_HOURS
        value: "1"

      # ---- Optional: email -------------------------------------------------
      # Without these, signup still works but verification and password-reset
      # mail is skipped and the API says so rather than silently succeeding.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_NAME
        value: MediaTools
      - key: FROM_EMAIL
        sync: false

      # ---- Optional: admin -------------------------------------------------
      # The account with this email is promoted to admin on login. Replaces the
      # credentials that used to be hardcoded in the auth route.
      - key: ADMIN_EMAIL
        sync: false

      # ---- Keep-warm (anti-sleep) -----------------------------------------
      # Pings the service's own /api/health through Render's public URL every
      # 10 minutes, so the free instance never accumulates the 15 idle minutes
      # that trigger Render's spin-down. Trade-off, accepted: one service
      # running 24/7 uses ~730 of the free plan's 750 monthly instance-hours,
      # so this consumes nearly the whole allowance for the account — any
      # OTHER free service on the same account will run out of hours.
      # More reliable still is an external pinger (UptimeRobot / cron-job.org
      # hitting /api/health every 5-10 min), because it also works after a
      # deploy or crash when no timer inside the container is running.
      - key: SELF_PING
        value: "true"

      # ---- Optional: payments and media storage ---------------------------
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
